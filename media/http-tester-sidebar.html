<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTTP Tester - Sidebar</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--vscode-font-family);
        color: var(--vscode-foreground);
        background-color: var(--vscode-sideBar-background);
        padding: 12px;
      }

      .header {
        margin-bottom: 16px;
      }

      .header h2 {
        font-size: 14px;
        font-weight: 600;
        color: var(--vscode-foreground);
        margin-bottom: 8px;
      }

      .button {
        width: 100%;
        padding: 8px 12px;
        background-color: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
        border: none;
        border-radius: 2px;
        cursor: pointer;
        font-size: 13px;
        margin-bottom: 8px;
        text-align: left;
      }

      .button:hover {
        background-color: var(--vscode-button-hoverBackground);
      }

      .button.primary {
        background-color: var(--vscode-button-background);
      }

      .button.secondary {
        background-color: var(--vscode-button-secondaryBackground);
        color: var(--vscode-button-secondaryForeground);
      }

      .section {
        margin-bottom: 20px;
      }

      .section-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        color: var(--vscode-descriptionForeground);
        margin-bottom: 8px;
      }

      .group-container {
        margin-bottom: 12px;
      }

      .group-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--vscode-foreground);
        padding: 4px 8px;
        background-color: var(--vscode-list-hoverBackground);
        border-radius: 2px;
        margin-bottom: 4px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .group-title::after {
        content: '▼';
        font-size: 8px;
      }

      .group-title.collapsed::after {
        content: '▶';
      }

      .group-content.collapsed {
        display: none;
      }

      .collection-list {
        list-style: none;
      }

      .collection-item {
        padding: 6px 8px;
        margin-bottom: 2px;
        border-radius: 2px;
        cursor: pointer;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .collection-item:hover {
        background-color: var(--vscode-list-hoverBackground);
      }

      .collection-item:hover .delete-item-btn {
        display: flex;
      }

      .collection-name {
        flex-grow: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .collection-method {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 2px;
        margin-left: 8px;
        font-weight: 600;
        min-width: 50px;
        text-align: center;
      }

      .delete-item-btn {
        display: none;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        margin-left: 4px;
        color: var(--vscode-descriptionForeground);
        border-radius: 2px;
      }

      .delete-item-btn:hover {
        background-color: var(--vscode-toolbar-hoverBackground);
        color: var(--vscode-errorForeground);
      }

      .method-GET {
        background-color: #61affe;
        color: #fff;
      }

      .method-POST {
        background-color: #49cc90;
        color: #fff;
      }

      .method-PUT {
        background-color: #fca130;
        color: #fff;
      }

      .method-DELETE {
        background-color: #f93e3e;
        color: #fff;
      }

      .method-PATCH {
        background-color: #50e3c2;
        color: #fff;
      }

      .empty-state {
        text-align: center;
        padding: 20px;
        color: var(--vscode-descriptionForeground);
        font-size: 12px;
      }

      .import-button {
        background-color: #10b981;
        color: white;
      }

      .import-button:hover {
        background-color: #059669;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h2>HTTP Tester</h2>
      <button class="button primary" id="open-editor-button">
        ✨ Nueva ventana
      </button>
      <button class="button import-button" id="import-json-button">
        📥 Importar coleccion JSON
      </button>
      <button class="button secondary" id="export-json-button">
        📤 Exportar coleccion JSON
      </button>
      <button class="button" id="clear-collections-button" style="background-color: var(--vscode-errorForeground); color: white;">
        🗑️ Limpiar Colecciones
      </button>
    </div>

    <div class="section">
      <div class="section-title">Global Auth (Bearer)</div>
      <div style="margin-bottom: 8px; display: flex; gap: 4px;">
        <input type="password" id="global-token" placeholder="Token Global" 
               style="flex: 1; padding: 6px; background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border); border-radius: 2px; font-size: 12px;">
        <button class="button primary" id="save-global-token" style="width: auto; margin-bottom: 0; padding: 4px 8px;">
          💾
        </button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Colecciones HTTP</div>
      <div id="http-collections-container">
        <li class="empty-state">No hay colecciones guardadas</li>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Colecciones Socket</div>
      <div id="socket-collections-container">
        <li class="empty-state">No hay colecciones guardadas</li>
      </div>
    </div>

    <script>
      const vscode = acquireVsCodeApi();

      const openEditorButton = document.getElementById("open-editor-button");
      const importJsonButton = document.getElementById("import-json-button");
      const exportJsonButton = document.getElementById("export-json-button");
      const clearCollectionsButton = document.getElementById("clear-collections-button");
      const httpCollectionsContainer = document.getElementById("http-collections-container");
      const socketCollectionsContainer = document.getElementById("socket-collections-container");
      const globalTokenInput = document.getElementById("global-token");
      const saveGlobalTokenButton = document.getElementById("save-global-token");

      let collections = [];
      let currentTab = "http";
      let collapsedGroups = new Set();

      // Clear Collections
      clearCollectionsButton.addEventListener("click", () => {
        vscode.postMessage({
          command: "clearCollections"
        });
      });

      // Save Global Token
      saveGlobalTokenButton.addEventListener("click", () => {
        vscode.postMessage({
          command: "updateGlobalToken",
          token: globalTokenInput.value
        });
      });

      // Open editor button
      openEditorButton.addEventListener("click", () => {
        vscode.postMessage({
          command: "openInEditor",
          collection: null
        });
      });

      // Import JSON button
      importJsonButton.addEventListener("click", () => {
        vscode.postMessage({
          command: "importJson",
          type: currentTab
        });
      });

      // Export JSON button
      exportJsonButton.addEventListener("click", () => {
        if (collections.length === 0) {
          alert("No hay colecciones para exportar");
          return;
        }
        vscode.postMessage({
          command: "exportJson",
          collections: collections
        });
      });

      // Render collections
      function renderCollections() {
        const httpCollections = collections.filter(c => c.type === "http");
        const socketCollections = collections.filter(c => c.type === "socket");

        // Render HTTP collections
        renderGroupedCollections(httpCollections, httpCollectionsContainer, "http");

        // Render Socket collections
        renderGroupedCollections(socketCollections, socketCollectionsContainer, "socket");

        // Add click listeners
        document.querySelectorAll('.collection-item').forEach(item => {
          item.addEventListener('click', () => {
            const name = item.getAttribute('data-name');
            const type = item.getAttribute('data-type');
            const collection = collections.find(c => c.name === name && c.type === type);
            
            if (collection) {
              vscode.postMessage({
                command: "openInEditor",
                collection: collection
              });
            }
          });
        });

        // Add group toggle listeners
        document.querySelectorAll('.group-title').forEach(title => {
          title.addEventListener('click', () => {
            const groupName = title.getAttribute('data-group');
            const content = title.nextElementSibling;
            
            if (collapsedGroups.has(groupName)) {
              collapsedGroups.delete(groupName);
              title.classList.remove('collapsed');
              content.classList.remove('collapsed');
            } else {
              collapsedGroups.add(groupName);
              title.classList.add('collapsed');
              content.classList.add('collapsed');
            }
          });
        });
      }

      function renderGroupedCollections(cols, container, type) {
        if (cols.length === 0) {
          container.innerHTML = '<li class="empty-state">No hay colecciones guardadas</li>';
          return;
        }

        // Group by group property
        const groups = {};
        cols.forEach(col => {
          const groupName = col.group || "Otros";
          if (!groups[groupName]) {
            groups[groupName] = [];
          }
          groups[groupName].push(col);
        });

        let html = '';
        for (const [groupName, groupCols] of Object.entries(groups)) {
          const isCollapsed = collapsedGroups.has(groupName);
          html += `
            <div class="group-container">
              <div class="group-title ${isCollapsed ? 'collapsed' : ''}" data-group="${groupName}">
                ${groupName}
              </div>
              <div class="group-content ${isCollapsed ? 'collapsed' : ''}">
                <ul class="collection-list">
                  ${groupCols.map(col => `
                    <li class="collection-item" data-name="${col.name}" data-type="${type}">
                      <span class="collection-name">${col.name}</span>
                      ${type === 'http' ? `<span class="collection-method method-${col.method}">${col.method}</span>` : ''}
                      <span class="delete-item-btn" title="Eliminar" data-name="${col.name}" data-type="${type}">🗑️</span>
                    </li>
                  `).join('')}
                </ul>
              </div>
            </div>
          `;
        }
        container.innerHTML = html;

        // Add delete button listeners
        container.querySelectorAll('.delete-item-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation(); // Evitar que se abra en el editor
            const name = btn.getAttribute('data-name');
            const type = btn.getAttribute('data-type');
            
            vscode.postMessage({
              command: "deleteCollection",
              name: name,
              type: type
            });
          });
        });
      }

      // Handle messages from extension
      window.addEventListener("message", (event) => {
        const message = event.data;

        switch (message.command) {
          case "loadCollections":
            if (message.collections && Array.isArray(message.collections)) {
              collections = message.collections;
              renderCollections();
            }
            break;
          case "loadGlobalToken":
            if (message.token !== undefined) {
              globalTokenInput.value = message.token;
            }
            break;
          case "importedCollections":
            if (message.collections && Array.isArray(message.collections)) {
              // Add imported collections
              message.collections.forEach(importedCol => {
                const exists = collections.find(
                  c => c.name === importedCol.name && c.type === importedCol.type
                );
                if (!exists) {
                  collections.push(importedCol);
                }
              });
              renderCollections();
            }
            break;
        }
      });

      // Initial render
      renderCollections();

      // Signal ready
      vscode.postMessage({ command: "ready" });
    </script>
  </body>
</html>
